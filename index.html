<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="SakuKita — Aplikasi catatan keuangan pribadi. Catat. Atur. Tumbuh.">
  <meta name="theme-color" content="#1B4F8A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SakuKita — Catat. Atur. Tumbuh.</title>
  <link rel="icon" type="image/png" href="assets/images/Logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .spinner-sm { width:18px;height:18px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spinOnce 0.6s linear infinite;display:inline-block;vertical-align:middle; }
  </style>
</head>
<body>
  <div class="page-login" id="page-login">

    <!-- Decorative floating circles -->
    <div style="position:absolute;top:15%;left:8%;width:60px;height:60px;border-radius:50%;background:rgba(212,160,48,0.12);animation:float 4s ease-in-out infinite;"></div>
    <div style="position:absolute;top:30%;right:12%;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.06);animation:float 3.5s ease-in-out infinite 0.5s;"></div>
    <div style="position:absolute;bottom:25%;left:15%;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.04);animation:float 5s ease-in-out infinite 1s;"></div>

    <!-- Login Card -->
    <div class="login-card">
      <div class="login-logo">
        <img src="assets/images/Logo.png" alt="SakuKita Logo" id="login-logo-img">
      </div>

      <div class="login-brand">
        <h1 class="login-brand__name">Saku<span>Kita</span></h1>
        <p class="login-brand__tagline">Catat. Atur. Tumbuh.</p>
      </div>

      <h2 style="text-align:center;font-size:var(--font-size-lg);font-weight:700;color:var(--neutral-700);margin-bottom:var(--space-lg);" id="auth-title">Masuk</h2>

      <form onsubmit="App.handleAuth(event)" id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-username">Username</label>
          <input type="text" class="form-input" id="login-username" placeholder="Masukkan username..." autocomplete="username" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" class="form-input" id="login-password" placeholder="Masukkan password..." autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn--gold btn--full btn--lg" id="btn-auth-submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Masuk
        </button>
      </form>

      <p style="text-align:center;margin-top:var(--space-lg);font-size:var(--font-size-sm);color:var(--neutral-500);" id="auth-toggle-text">
        Belum punya akun? <a href="#" onclick="App.toggleAuthMode(); return false;" style="color:var(--primary-500);font-weight:600;">Daftar</a>
      </p>

      <p style="text-align:center;margin-top:var(--space-md);font-size:var(--font-size-xs);color:var(--neutral-400);">
        Data tersimpan aman di cloud ☁️🔒
      </p>
    </div>

    <p style="position:absolute;bottom:24px;text-align:center;font-size:var(--font-size-xs);color:rgba(255,255,255,0.4);z-index:1;">
      Design by Syaiful Dev
    </p>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Auto redirect if already logged in
    (async function() {
      try {
        var result = await supabaseClient.auth.getSession();
        if (result.data.session) window.location.href = 'dashboard.html';
      } catch (err) {
        console.error('[SakuKita] session check error:', err);
      }
    })();
  </script>
</body>
</html>
