<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Laporan Keuangan SakuKita — Lihat dan export laporan bulanan.">
  <meta name="theme-color" content="#2D6EB5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Laporan — SakuKita</title>
  <link rel="icon" type="image/png" href="assets/images/Logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .spinner { width:32px;height:32px;border:3px solid var(--neutral-200);border-top-color:var(--primary-500);border-radius:50%;animation:spinOnce 0.7s linear infinite;margin:0 auto; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- ====== APP BAR ====== -->
    <header class="app-bar">
      <div class="app-bar__left">
        <img src="assets/images/Logo.png" alt="Logo" class="app-bar__logo">
        <div class="app-bar__title">Saku<span>Kita</span></div>
      </div>
      <div class="app-bar__right">
        <button class="app-bar__icon-btn" onclick="App.exportPDF()" title="Export PDF" id="btn-export-pdf">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ====== MAIN CONTENT ====== -->
    <main class="main-content">
      <h2 style="font-size:var(--font-size-xl);font-weight:700;color:var(--neutral-800);margin-bottom:var(--space-md);">📒 Laporan Keuangan</h2>

      <!-- Month Picker -->
      <div class="month-picker">
        <button class="month-picker__btn" onclick="App.prevMonth()" id="btn-prev-month">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="month-picker__label" id="report-month-label">April 2026</div>
        <button class="month-picker__btn" onclick="App.nextMonth()" id="btn-next-month">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <!-- Report Summary -->
      <div class="report-summary">
        <div class="report-summary__card">
          <div class="report-summary__label">Pemasukan</div>
          <div class="report-summary__value report-summary__value--income" id="report-income">Rp 0</div>
        </div>
        <div class="report-summary__card">
          <div class="report-summary__label">Pengeluaran</div>
          <div class="report-summary__value report-summary__value--expense" id="report-expense">Rp 0</div>
        </div>
        <div class="report-summary__card">
          <div class="report-summary__label">Saldo</div>
          <div class="report-summary__value report-summary__value--balance" id="report-balance">Rp 0</div>
        </div>
      </div>

      <!-- Tab Filter -->
      <div class="tab-filter">
        <button class="tab-filter__btn active" data-filter="all" onclick="App.setReportFilter('all')" id="filter-all">Semua</button>
        <button class="tab-filter__btn" data-filter="income" onclick="App.setReportFilter('income')" id="filter-income">Masuk</button>
        <button class="tab-filter__btn" data-filter="expense" onclick="App.setReportFilter('expense')" id="filter-expense">Keluar</button>
      </div>

      <!-- Report Table -->
      <div class="report-table-wrapper">
        <table class="report-table">
          <thead>
            <tr>
              <th>No</th>
              <th>Tanggal</th>
              <th>Keterangan</th>
              <th>Jumlah</th>
              <th>Saldo</th>
            </tr>
          </thead>
          <tbody id="report-tbody">
            <tr><td colspan="5" style="text-align:center;padding:32px;"><div class="spinner"></div></td></tr>
          </tbody>
          <tfoot id="report-tfoot"></tfoot>
        </table>
      </div>

      <!-- Export PDF Button -->
      <div style="margin-top:var(--space-lg);text-align:center;">
        <button class="btn btn--primary btn--full" onclick="App.exportPDF()" id="btn-export-pdf-bottom">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Export PDF
        </button>
      </div>
    </main>

    <!-- ====== BOTTOM NAV ====== -->
    <nav class="bottom-nav">
      <div class="bottom-nav__list">
        <a href="dashboard.html" class="bottom-nav__item" id="nav-dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Beranda</span>
        </a>
        <a href="laporan.html" class="bottom-nav__item active" id="nav-laporan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          <span>Laporan</span>
        </a>
      </div>
    </nav>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      await App.initReport();
    });
  </script>
</body>
</html>
